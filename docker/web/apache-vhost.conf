<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    # app/ berada di luar document root sehingga tidak bisa diakses via HTTP.
    # Blokir jalur yang mencoba mencapai folder di luar document root.
    <DirectoryMatch "^/var/www/(app|database|docker)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
